name: CI
on:
  push:
    branches:
      - main
      - implement/**
      - feature/**
      - fix/**
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Verify Go contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Lint (including tests)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: Verify imports formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Tests
        run: make test
      - name: Race tests
        run: make race
      - name: Build
        run: make build
      - name: Standard-library-only module
        run: test "$(go list -m all)" = github.com/alexei-led/claude-proxy
