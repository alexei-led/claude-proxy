<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">One local endpoint, multiple native providers</title>
  <desc id="desc">Claude Code sends a native Anthropic request to claude-proxy on loopback. The exact configured model ID selects Anthropic or a company proxy, DeepSeek, GLM, or a local model server. Only the selected upstream receives the request.</desc>
  <style>
    text { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
    .title { font-size:22px; font-weight:650; letter-spacing:-.3px; }
    .detail { font-size:16px; fill:#475569; }
    .eyebrow { font-size:12px; font-weight:650; letter-spacing:1.4px; fill:#475569; }
    .wire,.arrow { fill:none; stroke:#64748b; }
    .wire { stroke-width:2; }
    .canvas { fill:#f8fafc; stroke:#dbe3ee; }
    .plain { fill:#ffffff; stroke:#dbe3ee; }
    .core { fill:#ecfdf5; stroke:#059669; }
    .core-text { fill:#064e3b; }
    .remote { fill:#eef2ff; stroke:#818cf8; }
    .remote-text { fill:#312e81; }
    .local { fill:#eff6ff; stroke:#60a5fa; }
    .junction { fill:#64748b; }
    @media (prefers-color-scheme: dark) {
      text { fill:#f1f5f9; }
      .detail,.eyebrow { fill:#cbd5e1; }
      .wire,.arrow { stroke:#94a3b8; }
      .canvas { fill:#0f172a; stroke:#334155; }
      .plain { fill:#1e293b; stroke:#475569; }
      .core { fill:#064e3b; stroke:#34d399; }
      .core-text { fill:#d1fae5; }
      .remote { fill:#312e81; stroke:#a5b4fc; }
      .remote-text { fill:#e0e7ff; }
      .local { fill:#172554; stroke:#93c5fd; }
      .junction { fill:#94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" class="arrow" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1098" height="428" rx="24" class="canvas"/>
  <text x="32" y="38" class="eyebrow">YOUR CLIENT</text>
  <text x="350" y="38" class="eyebrow">YOUR MACHINE</text>
  <text x="750" y="38" class="eyebrow">ONE SELECTED UPSTREAM</text>

  <rect x="32" y="173" width="208" height="100" rx="16" class="plain" stroke-width="1.5"/>
  <text x="136" y="213" text-anchor="middle" class="title">Claude Code</text>
  <text x="136" y="241" text-anchor="middle" class="detail">native Messages</text>

  <path d="M 240 223 H 336" class="wire" marker-end="url(#arrow)"/>
  <text x="289" y="205" text-anchor="middle" class="detail">local key</text>

  <rect x="350" y="173" width="266" height="100" rx="16" class="core" stroke-width="1.8"/>
  <text x="483" y="213" text-anchor="middle" class="title core-text">claude-proxy</text>
  <text x="483" y="241" text-anchor="middle" class="detail core-text">loopback · exact model ID</text>

  <path d="M 616 223 H 680 M 680 94 V 364" class="wire"/>
  <circle cx="680" cy="223" r="3.5" class="junction"/>
  <path d="M 680 94 H 736" class="wire" marker-end="url(#arrow)"/>
  <path d="M 680 184 H 736" class="wire" marker-end="url(#arrow)"/>
  <path d="M 680 274 H 736" class="wire" marker-end="url(#arrow)"/>
  <path d="M 680 364 H 736" class="wire" marker-end="url(#arrow)"/>

  <rect x="750" y="58" width="318" height="72" rx="14" class="remote"/>
  <text x="772" y="88" class="title remote-text">Anthropic / company</text>
  <text x="772" y="112" class="detail remote-text">session OAuth</text>

  <rect x="750" y="148" width="318" height="72" rx="14" class="remote"/>
  <text x="772" y="178" class="title remote-text">DeepSeek</text>
  <text x="772" y="202" class="detail remote-text">server-held provider key</text>

  <rect x="750" y="238" width="318" height="72" rx="14" class="remote"/>
  <text x="772" y="268" class="title remote-text">GLM</text>
  <text x="772" y="292" class="detail remote-text">server-held provider key</text>

  <rect x="750" y="328" width="318" height="72" rx="14" class="local"/>
  <text x="772" y="358" class="title">Local model server</text>
  <text x="772" y="382" class="detail">no provider credential</text>
</svg>
